<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Outliner</title>
    <meta name="description" content="A quiet outliner that lives in your browser." />
    <meta name="theme-color" content="#f7f5f0" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <script>
      (() => {
        try {
          const prefs = JSON.parse(localStorage.getItem("outliner-lab:prefs:v1") || "{}");
          if (prefs.theme === "light" || prefs.theme === "dark") document.documentElement.dataset.theme = prefs.theme;
          if (prefs.textSize === "small" || prefs.textSize === "large") document.documentElement.dataset.size = prefs.textSize;
        } catch {}
      })();
    </script>
  </head>
  <body>
    <header class="topbar">
      <nav class="crumbs" id="crumbs" aria-label="Breadcrumbs"></nav>
      <div class="topbar-actions">
        <label class="search" id="search-box">
          <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5" /><path d="M13 13l4 4" /></svg>
          <input id="search" type="search" placeholder="Search" autocomplete="off" spellcheck="false" aria-label="Search" />
          <kbd class="search-hint">/</kbd>
        </label>
        <button class="sync-status" id="sync-status" type="button" aria-label="Sync status" hidden><span></span></button>
        <button class="icon-button" id="menu-button" popovertarget="menu" aria-label="Menu">
          <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="4.5" cy="10" r="1.4" /><circle cx="10" cy="10" r="1.4" /><circle cx="15.5" cy="10" r="1.4" /></svg>
        </button>
      </div>
    </header>

    <main class="page" id="page">
      <div class="page-head">
        <h1 class="title text" id="title" contenteditable="plaintext-only" spellcheck="true" data-placeholder="Untitled"></h1>
        <div class="note title-note" id="title-note" contenteditable="plaintext-only" spellcheck="true" hidden></div>
        <nav class="backlinks" id="backlinks" aria-label="Linked from" hidden></nav>
      </div>
      <div class="search-summary" id="search-summary" hidden></div>
      <div class="columns-head" id="columns-head" hidden></div>
      <ul class="tree" id="tree" role="tree"></ul>
      <button class="add-item" id="add-item" type="button">
        <span class="add-plus" aria-hidden="true">+</span><span class="add-label">Add an item</span>
      </button>
    </main>

    <div class="menu" id="menu" popover>
      <div class="menu-section">
        <div class="menu-label">Theme</div>
        <div class="segmented" data-pref="theme" role="radiogroup" aria-label="Theme">
          <button type="button" data-value="system" role="radio">Auto</button>
          <button type="button" data-value="light" role="radio">Light</button>
          <button type="button" data-value="dark" role="radio">Dark</button>
        </div>
        <div class="menu-label">Text size</div>
        <div class="segmented" data-pref="textSize" role="radiogroup" aria-label="Text size">
          <button type="button" data-value="small" role="radio" class="size-small">Aa</button>
          <button type="button" data-value="medium" role="radio">Aa</button>
          <button type="button" data-value="large" role="radio" class="size-large">Aa</button>
        </div>
      </div>
      <div class="menu-section">
        <button type="button" class="menu-item" data-action="jump"><span>Jump to…</span><kbd class="menu-kbd">Ctrl K</kbd></button>
        <button type="button" class="menu-item" data-action="toggle-completed">
          <span>Show completed</span><span class="switch" id="completed-switch" aria-hidden="true"></span>
        </button>
        <button type="button" class="menu-item" data-action="toggle-columns">
          <span>Columns</span><span class="switch" id="columns-switch" aria-hidden="true"></span>
        </button>
        <button type="button" class="menu-item" data-action="expand-all"><span>Expand all</span></button>
        <button type="button" class="menu-item" data-action="collapse-all"><span>Collapse all</span></button>
        <button type="button" class="menu-item" data-action="delete-completed"><span>Delete completed</span></button>
        <button type="button" class="menu-item danger" data-action="clear-page"><span>Clear this page</span></button>
      </div>
      <div class="menu-section">
        <button type="button" class="menu-item" data-action="capture"><span>Capture…</span></button>
        <button type="button" class="menu-item" data-action="sync"><span>Sync…</span></button>
      </div>
      <div class="menu-section">
        <div class="menu-label">Export this page</div>
        <button type="button" class="menu-item" data-action="export-markdown"><span>Markdown</span><span class="menu-meta">.md</span></button>
        <button type="button" class="menu-item" data-action="export-opml"><span>OPML</span><span class="menu-meta">.opml</span></button>
        <button type="button" class="menu-item" data-action="export-json"><span>Full backup</span><span class="menu-meta">.json</span></button>
        <button type="button" class="menu-item" data-action="import"><span>Import into this page…</span></button>
      </div>
      <div class="menu-section">
        <button type="button" class="menu-item" data-action="help"><span>Keyboard shortcuts</span><kbd>?</kbd></button>
      </div>
      <div class="menu-footer" id="build-info"><span id="storage-info">Stored only in this browser</span> · build <span id="build-commit"></span></div>
      <input type="file" id="import-file" accept=".json,.opml,.xml,.txt,.md,application/json,text/xml,text/plain" hidden />
    </div>

    <div class="menu item-menu" id="item-menu" popover>
      <div class="item-menu-title" id="item-menu-title"></div>
      <div class="menu-section">
        <button type="button" class="menu-item" data-item-action="zoom"><span>Zoom in</span></button>
        <button type="button" class="menu-item" data-item-action="fold"><span>Collapse</span></button>
        <button type="button" class="menu-item" data-item-action="note"><span>Add a note</span></button>
        <button type="button" class="menu-item" data-item-action="complete"><span>Complete</span></button>
        <button type="button" class="menu-item" data-item-action="duplicate"><span>Duplicate</span></button>
        <button type="button" class="menu-item" data-item-action="move"><span>Move to…</span></button>
        <button type="button" class="menu-item" data-item-action="copy"><span>Copy as text</span></button>
      </div>
      <div class="menu-section">
        <button type="button" class="menu-item danger" data-item-action="delete"><span>Delete</span></button>
      </div>
    </div>

    <div class="toolbar" id="toolbar" aria-label="Editing tools">
      <button type="button" data-action="outdent" aria-label="Outdent"><svg viewBox="0 0 20 20"><path d="M12 5l-5 5 5 5" /></svg></button>
      <button type="button" data-action="indent" aria-label="Indent"><svg viewBox="0 0 20 20"><path d="M8 5l5 5-5 5" /></svg></button>
      <button type="button" data-action="move-up" aria-label="Move up"><svg viewBox="0 0 20 20"><path d="M10 16V4M5 9l5-5 5 5" /></svg></button>
      <button type="button" data-action="move-down" aria-label="Move down"><svg viewBox="0 0 20 20"><path d="M10 4v12M5 11l5 5 5-5" /></svg></button>
      <button type="button" data-action="complete" aria-label="Complete"><svg viewBox="0 0 20 20"><path d="M4 10.5l4 4 8-9" /></svg></button>
      <button type="button" data-action="note" aria-label="Note"><svg viewBox="0 0 20 20"><path d="M4 6h12M4 10h12M4 14h7" /></svg></button>
      <button type="button" data-action="undo" aria-label="Undo"><svg viewBox="0 0 20 20"><path d="M7.5 4.5L4 8l3.5 3.5M4 8h7.5a4.5 4.5 0 010 9H9" /></svg></button>
      <button type="button" data-action="done" aria-label="Done editing"><svg viewBox="0 0 20 20"><path d="M4 7l6 6 6-6" /></svg></button>
    </div>

    <dialog class="help" id="help">
      <header><h2>Keyboard shortcuts</h2><button class="icon-button" id="help-close" aria-label="Close">✕</button></header>
      <div class="help-grid" id="help-grid"></div>
    </dialog>

    <dialog class="help sync-dialog" id="sync-dialog">
      <header><h2>Sync</h2><button class="icon-button" id="sync-close" type="button" aria-label="Close">✕</button></header>
      <form id="sync-form" class="sync-form">
        <p class="sync-explain">
          Keeps this outline the same on every device connected to your sync server. If the server already
          holds an outline, this device switches to it.
        </p>
        <label>Server<input id="sync-server" type="url" required placeholder="https://dev.example.ts.net:10001" autocomplete="off" /></label>
        <label>Token<input id="sync-token" type="password" required autocomplete="off" /></label>
        <p class="sync-state" id="sync-state" role="status"></p>
        <div class="sync-actions">
          <button type="button" class="sync-disconnect" id="sync-disconnect">Turn sync off</button>
          <button type="submit" class="sync-connect">Connect</button>
        </div>
      </form>
    </dialog>

    <dialog class="help capture-dialog" id="capture-dialog">
      <header><h2>Capture</h2><button class="icon-button" id="capture-close" type="button" aria-label="Close">✕</button></header>
      <form id="capture-form" class="sync-form">
        <div class="capture-templates" id="capture-templates" role="radiogroup" aria-label="Template"></div>
        <label>Text<input id="capture-text" type="text" autocomplete="off" required /></label>
        <div id="capture-fields" class="capture-fields"></div>
        <p class="sync-state" id="capture-target"></p>
        <div class="sync-actions">
          <button type="submit" class="sync-connect">Capture</button>
        </div>
      </form>
    </dialog>

    <dialog class="palette" id="palette">
      <label class="palette-input">
        <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5" /><path d="M13 13l4 4" /></svg>
        <input type="text" autocomplete="off" spellcheck="false" aria-label="Find an item" />
      </label>
      <ul class="palette-results" role="listbox"></ul>
      <div class="palette-hint"></div>
    </dialog>

    <div class="toast" id="toast" role="status" hidden></div>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
