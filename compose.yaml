name: outliner-lab

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    volumes:
      - .:/workspace:z
      - node_modules:/workspace/node_modules
    ports:
      - "127.0.0.1:5188:5188"
    env_file: .env.sync
    environment:
      OUTLINE_SERVER: https://dev.taile622dc.ts.net:10001
    init: true

volumes:
  node_modules:
